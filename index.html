<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Chanda</title>
<style>
    :root { --morado: #9f7aea; --morado-osc: #805ad5; --borde: #e2e8f0; --texto: #4a5568; }
    body { font-family: 'Segoe UI', Tahoma, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 30px 12px; color: #333; }
    .contenedor { max-width: 550px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 12px; border: 1px solid #e1e8ed; box-shadow: 0 4px 15px rgba(0,0,0,.05); }
    h1 { color: var(--texto); font-size: 24px; text-align: center; margin: 0 0 15px; }
    #estado { font-size: 13px; color: #2b6cb0; background: #ebf8ff; border: 1px solid #bee3f8; padding: 8px 12px; border-radius: 6px; text-align: center; margin-bottom: 20px; }
    #estado.error { color: #9b2c2c; background: #fff5f5; border-color: #feb2b2; }

    .pestanas { display: flex; justify-content: center; gap: 8px; margin-bottom: 25px; padding-bottom: 5px; border-bottom: 2px solid #edf2f7; }
    .pestana { background: #edf2f7; color: var(--texto); }
    .pestana:hover:not(.activa) { background: var(--borde); }
    .pestana.activa { background: var(--morado); color: #fff; }
    .panel { display: none; }
    .panel.activo { display: block; }

    label { display: block; margin-top: 12px; color: var(--texto); font-weight: 600; font-size: 14px; }
    input, select { width: 100%; padding: 10px 12px; margin-top: 6px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; background: #f7fafc; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: #b794f4; background: #fff; }

    button { padding: 11px 22px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 600; color: #fff; background: var(--morado); transition: background .2s; }
    button:hover { background: var(--morado-osc); }
    .pestana { padding: 10px 20px; border-radius: 8px; }
    .acciones { margin-top: 25px; text-align: center; }
    .eliminar { background: #feb2b2; color: #9b2c2c; padding: 6px 12px; font-size: 12px; border-radius: 4px; }
    .eliminar:hover { background: #fc8181; color: #fff; }

    #mensaje { font-size: 14px; font-weight: 600; margin-top: 15px; text-align: center; }
    .ok { color: #38a169; } .err { color: #e53e3e; } .aviso { color: #dd6b20; }

    .tabla-wrap { overflow-x: auto; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    th, td { padding: 10px; text-align: center; border-bottom: 1px solid var(--borde); font-size: 14px; }
    th { background: #e9d8fd; color: var(--texto); }
    tr:nth-child(even) { background: #f7fafc; }
    .vacio { text-align: center; color: #718096; }
</style>
</head>
<body>
<div class="contenedor">
    <div id="estado">Conectando a Firebase...</div>
    <h1>La Chanda</h1>

    <div class="pestanas">
        <button class="pestana activa" data-panel="registrar">Registrar Producto</button>
        <button class="pestana" data-panel="inventario">Inventario</button>
    </div>

    <div id="registrar" class="panel activo">
        <form id="formulario">
            <label>ID del Producto:
                <input id="id" placeholder="Ej: P01" required>
            </label>
            <label>Nombre del Producto:
                <input id="nombre" placeholder="Ej: Croquetas Cachorro" required>
            </label>
            <label>Tipo de Mascota:
                <select id="tipo" required>
                    <option value="">Seleccione una opción</option>
                    <option>Perro</option>
                    <option>Gato</option>
                </select>
            </label>
            <label>Valor ($):
                <input type="number" id="valor" min="0" placeholder="Ej: 25000" required>
            </label>
            <label>Cantidad:
                <input type="number" id="cantidad" min="0" placeholder="Ej: 10" required>
            </label>
            <div class="acciones"><button type="submit">Registrar Producto</button></div>
        </form>
        <div id="mensaje"></div>
    </div>

    <div id="inventario" class="panel"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot }
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const db = getFirestore(initializeApp({
        apiKey: "AIzaSyBiPzvMzlSYdMimNKL5uu-BVxIVcqxhvSk",
        authDomain: "la-chanda-8def6.firebaseapp.com",
        projectId: "la-chanda-8def6",
        appId: "1:388693846062:web:07b91f696f5285b88357bf"
    }));

    const $ = id => document.getElementById(id);
    const estado = $("estado"), mensaje = $("mensaje"), inventario = $("inventario");

    // Evita inyección de HTML con los datos de la base
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    const mostrar = (texto, clase) => { mensaje.className = clase; mensaje.textContent = texto; };

    // Pestañas
    document.querySelector(".pestanas").addEventListener("click", e => {
        const btn = e.target.closest(".pestana");
        if (!btn) return;
        document.querySelectorAll(".pestana").forEach(b => b.classList.toggle("activa", b === btn));
        document.querySelectorAll(".panel").forEach(p => p.classList.toggle("activo", p.id === btn.dataset.panel));
    });

    // Registrar producto
    $("formulario").addEventListener("submit", async e => {
        e.preventDefault();
        const id = $("id").value.trim();
        if (id.includes("/")) return mostrar("El ID no puede contener «/».", "aviso");
        try {
            await setDoc(doc(db, "productos", id), {
                nombre: $("nombre").value.trim(),
                tipo: $("tipo").value,
                valor: Number($("valor").value),
                cantidad: Number($("cantidad").value)
            });
            mostrar("¡Producto registrado correctamente!", "ok");
            e.target.reset();
        } catch (err) {
            mostrar("Error al guardar: " + err.message, "err");
        }
    });

    // Inventario en tiempo real
    onSnapshot(collection(db, "productos"), snap => {
        estado.className = "";
        estado.textContent = "Conexión exitosa a la base de datos :D";

        if (snap.empty) {
            inventario.innerHTML = '<p class="vacio">No hay productos registrados en el inventario.</p>';
            return;
        }
        const filas = snap.docs.map(d => {
            const p = d.data();
            return `<tr>
                <td>${esc(d.id)}</td><td>${esc(p.nombre)}</td><td>${esc(p.tipo)}</td>
                <td>$${esc(p.valor || 0)}</td><td>${esc(p.cantidad || 0)}</td>
                <td><button class="eliminar" data-id="${esc(d.id)}">Eliminar</button></td>
            </tr>`;
        }).join("");
        inventario.innerHTML = `<div class="tabla-wrap"><table>
            <tr><th>ID</th><th>Producto</th><th>Tipo</th><th>Valor ($)</th><th>Cant.</th><th>Acción</th></tr>${filas}
        </table></div>`;
    }, err => {
        estado.className = "error";
        estado.textContent = "Error de conexión: " + err.message;
    });

    // Eliminar producto 
    inventario.addEventListener("click", async e => {
        const id = e.target.dataset.id;
        if (!id || !confirm(`¿Deseas eliminar el producto con ID "${id}"?`)) return;
        try { await deleteDoc(doc(db, "productos", id)); }
        catch (err) { alert("Error al eliminar: " + err.message); }
    });
</script>
</body>
</html>
